<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Sistema de Biblioteca</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #48bb78;
        }

        .btn-secondary:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            flex: 1;
            min-width: 200px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .card p {
            margin: 8px 0;
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .badge-disponible {
            background: #c6f6d5;
            color: #22543d;
        }

        .badge-prestado {
            background: #fed7d7;
            color: #742a2a;
        }

        .badge-activo {
            background: #bee3f8;
            color: #2c5282;
        }

        .badge-devuelto {
            background: #c6f6d5;
            color: #22543d;
        }

        .badge-vencido {
            background: #fbb6ce;
            color: #702459;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 13px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Sistema de Gestión de Biblioteca</h1>
            <p>Gestiona libros, usuarios y préstamos de forma eficiente</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="cambiarSeccion('libros')">📚 Libros</button>
            <button class="tab" onclick="cambiarSeccion('usuarios')">👥 Usuarios</button>
            <button class="tab" onclick="cambiarSeccion('prestamos')">📋 Préstamos</button>
            <button class="tab" onclick="cambiarSeccion('estadisticas')">📊 Estadísticas</button>
        </div>

        <!-- Sección Libros -->
        <div id="libros" class="section active">
            <div class="controls">
                <button class="btn" onclick="mostrarModalLibro()">➕ Agregar Libro</button>
                <input type="text" id="buscarLibro" placeholder="Buscar por título..." onkeyup="buscarLibros()">
                <select id="filtroCategoria" onchange="cargarLibros()">
                    <option value="">Todas las categorías</option>
                    <option value="Literatura">Literatura</option>
                    <option value="Clásicos">Clásicos</option>
                    <option value="Ficción">Ficción</option>
                    <option value="Infantil">Infantil</option>
                    <option value="Fantasía">Fantasía</option>
                </select>
                <select id="filtroEstado" onchange="cargarLibros()">
                    <option value="">Todos los estados</option>
                    <option value="Disponible">Disponible</option>
                    <option value="Prestado">Prestado</option>
                </select>
            </div>
            <div id="listaLibros" class="grid"></div>
        </div>

        <!-- Sección Usuarios -->
        <div id="usuarios" class="section">
            <div class="controls">
                <button class="btn" onclick="mostrarModalUsuario()">➕ Agregar Usuario</button>
                <select id="filtroTipoUsuario" onchange="cargarUsuarios()">
                    <option value="">Todos los tipos</option>
                    <option value="Estudiante">Estudiante</option>
                    <option value="Profesor">Profesor</option>
                    <option value="Administrativo">Administrativo</option>
                </select>
            </div>
            <div id="listaUsuarios" class="grid"></div>
        </div>

        <!-- Sección Préstamos -->
        <div id="prestamos" class="section">
            <div class="controls">
                <button class="btn" onclick="mostrarModalPrestamo()">➕ Nuevo Préstamo</button>
                <button class="btn-secondary btn" onclick="cargarPrestamosVencidos()">⚠️ Ver Vencidos</button>
                <select id="filtroEstadoPrestamo" onchange="cargarPrestamos()">
                    <option value="">Todos</option>
                    <option value="Activo">Activos</option>
                    <option value="Devuelto">Devueltos</option>
                </select>
            </div>
            <div id="listaPrestamos" class="grid"></div>
        </div>

        <!-- Sección Estadísticas -->
        <div id="estadisticas" class="section">
            <div class="stats" id="statsContainer"></div>
        </div>
    </div>

    <!-- Modal Libro -->
    <div id="modalLibro" class="modal">
        <div class="modal-content">
            <h2 id="tituloModalLibro">Agregar Libro</h2>
            <div id="alertLibro"></div>
            <form id="formLibro" onsubmit="guardarLibro(event)">
                <div class="form-group">
                    <label>Título *</label>
                    <input type="text" id="libroTitulo" required>
                </div>
                <div class="form-group">
                    <label>Autor *</label>
                    <input type="text" id="libroAutor" required>
                </div>
                <div class="form-group">
                    <label>Categoría *</label>
                    <select id="libroCategoria" required>
                        <option value="">Seleccionar...</option>
                        <option value="Literatura">Literatura</option>
                        <option value="Clásicos">Clásicos</option>
                        <option value="Ficción">Ficción</option>
                        <option value="Infantil">Infantil</option>
                        <option value="Fantasía">Fantasía</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ubicación *</label>
                    <input type="text" id="libroUbicacion" placeholder="Ej: Estante A-1" required>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="libroEstado">
                        <option value="Disponible">Disponible</option>
                        <option value="Prestado">Prestado</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn">Guardar</button>
                    <button type="button" class="btn btn-danger" onclick="cerrarModal('modalLibro')">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Usuario -->
    <div id="modalUsuario" class="modal">
        <div class="modal-content">
            <h2>Agregar Usuario</h2>
            <div id="alertUsuario"></div>
            <form id="formUsuario" onsubmit="guardarUsuario(event)">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="usuarioNombre" required>
                </div>
                <div class="form-group">
                    <label>Identificación *</label>
                    <input type="text" id="usuarioIdentificacion" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="usuarioEmail" required>
                </div>
                <div class="form-group">
                    <label>Teléfono *</label>
                    <input type="tel" id="usuarioTelefono" required>
                </div>
                <div class="form-group">
                    <label>Tipo *</label>
                    <select id="usuarioTipo" required>
                        <option value="Estudiante">Estudiante</option>
                        <option value="Profesor">Profesor</option>
                        <option value="Administrativo">Administrativo</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn">Guardar</button>
                    <button type="button" class="btn btn-danger" onclick="cerrarModal('modalUsuario')">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Préstamo -->
    <div id="modalPrestamo" class="modal">
        <div class="modal-content">
            <h2>Nuevo Préstamo</h2>
            <div id="alertPrestamo"></div>
            <form id="formPrestamo" onsubmit="guardarPrestamo(event)">
                <div class="form-group">
                    <label>Usuario *</label>
                    <select id="prestamoUsuario" required></select>
                </div>
                <div class="form-group">
                    <label>Libro *</label>
                    <select id="prestamoLibro" required></select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn">Crear Préstamo</button>
                    <button type="button" class="btn btn-danger" onclick="cerrarModal('modalPrestamo')">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
